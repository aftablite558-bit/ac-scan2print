<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Admin Dashboard — AMAN COMPUTER</title>
    <meta
      name="description"
      content="AMAN COMPUTER Admin Dashboard — business workspace, team access, display appearance, alert preferences, and system data management."
    />
    <meta property="og:title" content="AMAN COMPUTER — Admin Dashboard" />
    <meta
      property="og:description"
      content="Admin Dashboard for AMAN COMPUTER printing services and studio operations."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function (d) {
        try {
          var t = JSON.parse(localStorage.getItem('aman-computer:theme') || '"dark"');
          d.dataset.theme =
            t === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : t;
        } catch (e) {
          d.dataset.theme = 'dark';
        }
      })(document.documentElement);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
